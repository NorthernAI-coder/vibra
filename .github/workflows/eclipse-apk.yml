name: EclipseCam APK

on:
  push:
    branches: [chatgpt/eclipse-apk-build, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eclipse-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle --no-daemon :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: EclipseCam-Pixel6Pro-debug
          path: eclipse-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
